[project]
name = "unit-test-agent-lab"
version = "0.1.0"
description = "Durable coverage-triggered test generation lab"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2", "psycopg[binary,pool]==3.3.6",
  "httpx==0.28.1", "pydantic-settings==2.15.0", "pyyaml==6.0.3",
  "defusedxml==0.7.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9"]
proxy = ["litellm[proxy]==1.102.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["postgres: requires TEST_DATABASE_URL", "integration: local component integration"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".tools", ".state", "tmp", "workspaces"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
