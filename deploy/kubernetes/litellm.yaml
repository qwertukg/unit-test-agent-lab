model_list:
  - model_name: test-agent
    litellm_params:
      model: os.environ/SPARK_MODEL
      api_base: os.environ/SPARK_1_BASE
      api_key: os.environ/SPARK_API_KEY
  - model_name: test-agent
    litellm_params:
      model: os.environ/SPARK_MODEL
      api_base: os.environ/SPARK_2_BASE
      api_key: os.environ/SPARK_API_KEY
  - model_name: test-agent
    litellm_params:
      model: os.environ/SPARK_MODEL
      api_base: os.environ/SPARK_3_BASE
      api_key: os.environ/SPARK_API_KEY
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 30
  timeout: 130
litellm_settings:
  telemetry: false
  set_verbose: false
general_settings:
  master_key: os.environ/MODEL_API_KEY
