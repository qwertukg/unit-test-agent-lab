kind: ConfigMap
metadata:
  name: agent-config-hg86b598f6
  namespace: unit-test-agent
---
apiVersion: v1
data:
  litellm.yaml: |
    model_list:
      - model_name: test-agent
        litellm_params:
          model: os.environ/SPARK_MODEL
          api_base: os.environ/SPARK_1_BASE
