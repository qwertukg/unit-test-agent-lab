  namespace: unit-test-agent
spec:
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: unit-test-litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: unit-test-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unit-test-agent
  template:
    metadata:
      labels:
        app: unit-test-agent
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PROJECT_CONFIG
          value: /etc/agent/projects.yaml
        envFrom:
        - secretRef:
            name: agent-secrets
        image: registry.example.invalid/unit-test-agent:0.1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        name: api
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/agent
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      - command:
        - python
        - -m
        - agent_lab.worker
        env:
        - name: PROJECT_CONFIG
          value: /etc/agent/projects.yaml
        envFrom:
        - secretRef:
            name: agent-secrets
        image: registry.example.invalid/unit-test-agent:0.1
        name: worker
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/agent
          name: config
          readOnly: true
        - mountPath: /app/workspaces
          name: workspaces
        - mountPath: /tmp
          name: tmp
      initContainers:
      - command:
        - python
        - -m
        - agent_lab.migrate
        envFrom:
        - secretRef:
            name: agent-secrets
        image: registry.example.invalid/unit-test-agent:0.1
        name: migrate
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: agent-config-hg86b598f6
        name: config
      - emptyDir:
          sizeLimit: 4Gi
        name: workspaces
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: unit-test-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unit-test-litellm
  template:
    metadata:
      labels:
        app: unit-test-litellm
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - litellm
        - --config
        - /etc/proxy/litellm.yaml
        - --port
        - "4000"
        - --num_workers
        - "1"
        envFrom:
        - secretRef:
            name: model-secrets
        image: registry.example.invalid/unit-test-agent-proxy:0.1
        name: proxy
        ports:
        - containerPort: 4000
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/proxy
          name: config
          readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: litellm-config-54h694ktmc
        name: config
